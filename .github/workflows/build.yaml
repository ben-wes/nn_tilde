name: Build nn_tilde
on:
  push:
    tags:
      - "v*"

jobs:
  macos-arm64-build:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - run: | 
          git submodule update --init --recursive
          git fetch --tags
          curl -L  ${{ secrets.WHEEL_PATH }} -o src/models/wheel.ts
          du -sh src/models/*
      - name: Setup LLVM
        run: |
          brew install llvm 
      - name: Setup miniconda
        run: |
          curl -L https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh > miniconda.sh
          chmod +x ./miniconda.sh
          bash ./miniconda.sh -b -u -p ./env
          source ./env/bin/activate
          pip install -r requirements.txt
          conda install -c conda-forge curl
      - name: Setup puredata
        run: |
          mkdir puredata_include
          curl -L https://raw.githubusercontent.com/pure-data/pure-data/master/src/m_pd.h -o puredata_include/m_pd.h
      - name: Build
        run: |
          mkdir build
          export CC=$(brew --prefix llvm)/bin/clang
          export CXX=$(brew --prefix llvm)/bin/clang++
          cd build
          cmake ../src -DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX -DCMAKE_PREFIX_PATH=${{ github.workspace }}/env/lib/python3.12/site-packages/torch -DCMAKE_BUILD_TYPE=Release -DPUREDATA_INCLUDE_DIR=${{ github.workspace }}/puredata_include -DCMAKE_OSX_ARCHITECTURES=arm64
          make
      - name: Max/MSP Package creation
        run: |
          mkdir nn_tilde
          mkdir nn_tilde/help
          mv src/externals src/help src/support src/patchers src/extras src/package-info.json src/icon.png src/source src/models src/misc nn_tilde
          tar -czvf nn_max_msp_macOS_arm64.tar.gz nn_tilde
      - name: PureData Package creation
        run: |
          mv build/frontend/puredata/nn_tilde .
          mv src/frontend/puredata/nn_tilde/nn~-help.pd nn_tilde
          rm -fr nn_tilde/CMakeFiles/ nn_tilde/*.cmake nn_tilde/Makefile
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nn_tilde_mac_arm64
          path: |
            nn_max_msp_macOS_arm64.tar.gz
            nn_puredata_macOS_arm64.tar.gz

  osx-x64-build:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - run: | 
          git submodule update --init --recursive
          git fetch --tags
          git describe --tags --always
          curl -L  ${{ secrets.WHEEL_PATH }} -o src/models/wheel.ts

      - name: Install x86_64 Homebrew
        run: |
          sudo rm -rf /opt/homebrew
          sudo rm -rf /usr/local/homebrew
          sudo mkdir -p /usr/local/homebrew
          sudo chown -R $(whoami) /usr/local/homebrew
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" --prefix=/usr/local/homebrew
          arch -x86_64 /usr/local/bin/brew shellenv >> $GITHUB_ENV

      - name: Setup miniconda
        run: |
          curl -L https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-x86_64.sh > miniconda.sh
          chmod 777 ./miniconda.sh
          bash ./miniconda.sh -b -u -p ./env
          source ./env/bin/activate
          arch -x86_64 pip install -r requirements.txt
          arch -x86_64 pip install cmake==3.28
          arch -x86_64 conda install -c conda-forge curl
          TARGET_DIR=$(find env/lib -type d -name "python3*")
          TARGET_DIR="${TARGET_DIR}/site-packages/torch/share/cmake/Caffe2/public"
          cp install/mkl.cmake "${TARGET_DIR}"  

      - name: Setup LLVM
        run: |
          rm '/usr/local/bin/pydoc3'
          rm /usr/local/bin/pydoc3.13
          rm /usr/local/bin/python3
          rm /usr/local/bin/python3-config
          rm /usr/local/bin/python3.13
          rm /usr/local/bin/python3.13-config
          rm '/usr/local/bin/pip3.13'
          rm '/usr/local/bin/idle3'
          rm '/usr/local/bin/idle3.13'
          arch -x86_64 /usr/local/bin/brew install llvm
          export LDFLAGS="-L/usr/local/opt/llvm/lib"
          export CPPFLAGS="-I/usr/local/opt/llvm/include"

      - name: Setup puredata
        run: |
          mkdir puredata_include
          curl -L https://raw.githubusercontent.com/pure-data/pure-data/master/src/m_pd.h -o puredata_include/m_pd.h

      - name: Build
        run: |
          mkdir build
          export CC=$(/usr/local/bin/brew --prefix llvm)/bin/clang
          export CXX=$(/usr/local/bin/brew --prefix llvm)/bin/clang++
          cd build
          arch -x86_64 ../env/bin/cmake ../src -DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX -DCMAKE_PREFIX_PATH=${{ github.workspace }}/env/lib/python3.12/site-packages/torch -DCMAKE_BUILD_TYPE=Release -DPUREDATA_INCLUDE_DIR=${{ github.workspace }}/puredata_include -DCMAKE_OSX_ARCHITECTURES=x86_64
          arch -x86_64 make
      - name: Max/MSP Package creation
        run: |
          mkdir nn_tilde
          mkdir nn_tilde/help
          mv src/externals src/help src/support src/patchers src/extras src/package-info.json src/icon.png src/source src/models src/misc nn_tilde
          tar -czvf nn_max_msp_macOS_x64.tar.gz nn_tilde
      - name: PureData Package creation
        run: |
          mv build/frontend/puredata/nn_tilde .
          mv src/frontend/puredata/nn_tilde/nn~-help.pd nn_tilde
          rm -fr nn_tilde/CMakeFiles/ nn_tilde/*.cmake nn_tilde/Makefile
            tar -czvf nn_puredata_macOS_x64.tar.gz nn_tilde
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nn_tilde_mac_x86_64
          path: |
            nn_max_msp_macOS_x64.tar.gz
            nn_puredata_macOS_x64.tar.gz

  linux:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            artifact-name: nn_linux_puredata_x86_64
            conda-url: https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            conda-url: https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-aarch64.sh
            artifact-name: nn_linux_puredata_arm64
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - run: | 
          git submodule update --init --recursive
          git fetch --tags
          GIT_TRACE=1 git describe --tags --always
      - name: Setup LLVM
        run: |
          sudo apt-get install -y ca-certificates
          sudo apt install gcc-10 g++-10
      - name: Setup miniconda
        run: |
          echo "architecture : $(uname -m)"
          curl --cacert /etc/ssl/certs/ca-certificates.crt -L ${{ matrix.conda-url }} > miniconda.sh
          chmod +x ./miniconda.sh
          bash ./miniconda.sh -b -u -p ./env
          source ./env/bin/activate
          pip3 install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          conda install -c conda-forge curl
      - name: Setup puredata
        run: |
          mkdir puredata_include
          curl --cacert /etc/ssl/certs/ca-certificates.crt -L https://raw.githubusercontent.com/pure-data/pure-data/master/src/m_pd.h -o puredata_include/m_pd.h
      - name: Build
        run: |
          mkdir build
          export CC=$(which gcc-10)
          export CXX=$(which g++-10)
          cd build
          cmake ../src -DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX -DCMAKE_PREFIX_PATH=${{ github.workspace }}/env/lib/python3.12/site-packages/torch -DCMAKE_BUILD_TYPE=Release -DPUREDATA_INCLUDE_DIR=${{ github.workspace }}/puredata_include
          make
      - name: PureData Package creation
        run: |
          mkdir nn_tilde
          mv build/frontend/puredata/nn_tilde .
          mv src/frontend/puredata/nn_tilde/nn~-help.pd nn_tilde
          rm -fr nn_tilde/CMakeFiles/ nn_tilde/*.cmake nn_tilde/Makefile
          tar -czvf ${{ matrix.artifact-name }}.tar.gz nn_tilde
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: 
            ${{ matrix.artifact-name }}.tar.gz

            
  windows-x64-build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - run: | 
          git submodule update --init --recursive
          git fetch --tags
          curl -L  ${{ secrets.WHEEL_PATH }} -o src/models/wheel.ts
      - name: Downloading Torch 
        run: |
          curl -L https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.6.0%2Bcpu.zip > "libtorch.zip"
          unzip libtorch.zip
          echo "TORCH_PATH=${{ github.workspace }}/libtorch" >> $GITHUB_ENV
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
          echo "RANLIB=ranlib" >> $GITHUB_ENV
      - name: Setup torch for ARM64
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libjpeg-dev libopenblas-dev libopenmpi-dev libomp-dev
          mkdir -p torch_arm64
          cd torch_arm64
          python3 -m pip download torch==2.5.1 \
            --only-binary=:all: \
            --platform manylinux2014_aarch64 \
            --python-version "3.10" \
            --implementation cp \
            --abi cp310 \
            --no-deps \
            --index-url https://pypi.org/simple
          unzip torch-2.5.1-cp310-cp310-manylinux2014_aarch64.whl
          rm torch-2.5.1-cp310-cp310-manylinux2014_aarch64.whl
          cd ..
          echo "TORCH_PATH=${{ github.workspace }}/torch_arm64/torch" >> $GITHUB_ENV
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "RANLIB=aarch64-linux-gnu-ranlib" >> $GITHUB_ENV

      - name: Setup puredata
        run: |
          mkdir puredata_include
          curl -L https://raw.githubusercontent.com/pure-data/pure-data/master/src/m_pd.h -o puredata_include/m_pd.h

      - name: Build
        run: |
          mkdir build
          cd build
          cmake ../src \
            -DCMAKE_PREFIX_PATH=${{ env.TORCH_PATH }} \
            -DPUREDATA_INCLUDE_DIR=${{ github.workspace }}/puredata_include \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ env.CC }} \
            -DCMAKE_CXX_COMPILER=${{ env.CXX }}
          make
          ${{ env.RANLIB }} backend/libbackend.a
          make

      - name: PureData Package creation
        run: |
          echo "Debug: Checking build directory structure..."
          ls -R build/
          
          mkdir -p nn_tilde
          
          # Move all built files
          mv build/frontend/puredata/nn_tilde/nn~.pd_linux nn_tilde/
          mv build/frontend/puredata/nn_tilde/nn~-help.pd nn_tilde/
          mv build/frontend/puredata/nn_tilde/lib*.so* nn_tilde/
          
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            # AMD64-specific handling
            cp /usr/lib/x86_64-linux-gnu/libgomp.so.1 nn_tilde/libgomp-a34b3233.so.1

            strip nn_tilde/nn~.pd_linux nn_tilde/lib*.so*
            echo "Checking AMD64 package dependencies:"
            ldd nn_tilde/nn~.pd_linux || true
          else
            # ARM64-specific handling
            echo "Debug: Looking for OpenBLAS library..."
            ls -la ${{ env.TORCH_PATH }}/lib/
            aarch64-linux-gnu-strip nn_tilde/nn~.pd_linux nn_tilde/lib*.so*
            echo "Checking ARM64 package dependencies:"
            echo "Dependencies for nn~.pd_linux:"
            aarch64-linux-gnu-readelf -d nn_tilde/nn~.pd_linux
            
            # Check all .so files
            for lib in nn_tilde/*.so; do
              echo -e "\nDependencies for $(basename $lib):"
              aarch64-linux-gnu-readelf -d "$lib"
            done
          fi
          
          echo "Final package contents:"
          ls -la nn_tilde/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nn_tilde-linux_${{ matrix.arch }}_${{ matrix.cuda }}
          path: nn_tilde

  windows-amd64-build:
    runs-on: windows-latest
    strategy:
      matrix:
        cuda: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Setup CUDA
        if: matrix.cuda == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: '12.4.0'
          method: 'network'
          use-local-cache: true
          sub-packages: '["nvcc", "cudart", "nvrtc", "visual_studio_integration"]'
          # sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cusparse", "cusparse_dev", "cufft", "cufft_dev", "cusolver", "cusolver_dev", "nvrtc", "visual_studio_integration"]'

      - name: Install NvToolsExt
        if: matrix.cuda == 'cuda'
        run: |
          New-Item -ItemType Directory -Force -Path "temp_build"
          Invoke-WebRequest -Uri "https://ossci-windows.s3.us-east-1.amazonaws.com/builder/NvToolsExt.7z" -OutFile "temp_build\NvToolsExt.7z"
          7z x temp_build\NvToolsExt.7z -otemp_build\NvToolsExt
          
          $nvToolsPath = "C:\Program Files\NVIDIA Corporation\NvToolsExt"
          New-Item -ItemType Directory -Force -Path "$nvToolsPath\bin\x64"
          New-Item -ItemType Directory -Force -Path "$nvToolsPath\include"
          New-Item -ItemType Directory -Force -Path "$nvToolsPath\lib\x64"
          
          Copy-Item "temp_build\NvToolsExt\bin\x64\*.*" -Destination "$nvToolsPath\bin\x64" -Force
          Copy-Item "temp_build\NvToolsExt\include\*.*" -Destination "$nvToolsPath\include" -Force
          Copy-Item "temp_build\NvToolsExt\lib\x64\*.*" -Destination "$nvToolsPath\lib\x64" -Force

      - name: Setup libtorch (CPU)
        if: matrix.cuda != 'cuda'
        run: |
          Invoke-WebRequest -Uri "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.5.1%2Bcpu.zip" -OutFile libtorch.zip
          Expand-Archive -Path libtorch.zip -DestinationPath .

      - name: Setup libtorch (CUDA)
        if: matrix.cuda == 'cuda'
        run: |
          Invoke-WebRequest -Uri "https://download.pytorch.org/libtorch/cu124/libtorch-win-shared-with-deps-2.5.1%2Bcu124.zip" -OutFile libtorch.zip
          Expand-Archive -Path libtorch.zip -DestinationPath .

      - name: Setup PureData
        run: |
          mkdir pd
          cd pd
          curl -L https://msp.ucsd.edu/Software/pd-0.55-2.msw.zip -o pd.zip
          unzip pd.zip
          mv pd*/src .
          mv pd*/bin .
          cd ..
      - name: Installing dependencies with vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg 
          ./bootstrap-vcpkg.bat
          ./vcpkg.exe integrate install
          ./vcpkg.exe install curl
          cd ..

      - name: Build
        run: |
          $VSInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $DumpbinPath = Join-Path $VSInstallPath "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe"
          $DumpbinExe = Get-ChildItem $DumpbinPath | Select-Object -First 1
          
          mkdir build
          cd build
          cmake ../src -G "Visual Studio 17 2022" -DTorch_DIR=${{ github.workspace }}/libtorch/share/cmake/Torch -DPUREDATA_INCLUDE_DIR=${{ github.workspace }}/pd/src -DPUREDATA_BIN_DIR=${{ github.workspace }}/pd/bin -A x64
          cmake --build . --config Release
          
      - name: Max/MSP Package creation
        run: |
          mkdir nn_tilde
          mkdir nn_tilde/support
          cp libtorch/lib/* nn_tilde/support
          cp vcpkg/installed/x64-windows/lib/*.lib nn_tilde/support
          cp vcpkg/installed/x64-windows/bin/*.dll nn_tilde/support
          curl -L https://curl.se/ca/cacert.pem -o nn_tilde/support/cacert.pem
          $files = @("src\externals", "src\help", "src\patchers", "src\extras", "src\package-info.json", "src\icon.png", "src\source", "src\models", "src\misc")
          foreach ($file in $files) {
            mv $file nn_tilde
          }
          curl -L https://nubo.ircam.fr/index.php/s/7xBPxJZA6nJFHkG -o ${{ secrets.WHEEL_PATH }}
          tar -czvf nn_max_msp_windows_x64.tar.gz nn_tilde
      - name: PureData Package creation
        run: |
          Remove-Item -Recurse -Force nn_tilde
          mkdir nn_tilde
          mv build/frontend/puredata/nn_tilde/Release/* nn_tilde/
          cp libtorch/lib/* nn_tilde/
          cp vcpkg/installed/x64-windows/lib/*.lib nn_tilde/
          cp vcpkg/installed/x64-windows/bin/*.dll nn_tilde/
          curl -L https://curl.se/ca/cacert.pem -o nn_tilde/cacert.pem
          tar -czvf nn_puredata_windows_x64.tar.gz nn_tilde
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nn_tilde_win_x64
          path: |
            nn_max_msp_windows_x64.tar.gz
            nn_puredata_windows_x64.tar.gz

  AutomaticRelease:
    runs-on: ubuntu-latest
    needs: [osx-arm64-build, osx-x64-build, linux, windows-x64-build]
    steps:
      - name: Download build binaries (mac_arm64)
        uses: actions/download-artifact@v4
        with:
          name: nn_tilde_mac_arm64
      - name: Download build binaries (mac_x86_64)
        uses: actions/download-artifact@v4
        with:
          name: nn_tilde_mac_x86_64
      - name: Download build binaries (linux_x86_64)
        uses: actions/download-artifact@v4
        with:
          name: nn_linux_puredata_x86_64
      - name: Download build binaries (linux arm64)
        uses: actions/download-artifact@v4
        with:
          name: nn_linux_puredata_arm64
      - name: Download build binaries (windows mac_x86_64)
        uses: actions/download-artifact@v4
        with:
          name: nn_tilde_win_x64 
      - name: Automated Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          prerelease: true
          draft: true
          files: |
            nn_max_msp_macOS_arm64.tar.gz
            nn_puredata_macOS_arm64.tar.gz
            nn_max_msp_macOS_x64.tar.gz
            nn_puredata_macOS_x64.tar.gz
            nn_linux_puredata_x86_64.tar.gz
            nn_linux_puredata_arm64.tar.gz
            nn_max_msp_windows_x64.tar.gz
            nn_puredata_windows_x64.tar.gz

